<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 工厂编辑器 · Factory Builder</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171c24;
      --panel-2: #1f2630;
      --border: #2a3340;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #4f9dff;
      --accent-2: #2b7de0;
      --danger: #ff5c5c;
      --ok: #3ad29f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      user-select: none;
    }
    #app { display: flex; height: 100vh; width: 100vw; }

    /* ---- 左侧：组件库 ---- */
    #sidebar {
      width: 220px; flex-shrink: 0; background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .side-head {
      padding: 14px 16px; font-size: 15px; font-weight: 700;
      letter-spacing: .5px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .side-head .logo { color: var(--accent); }
    .lib { padding: 10px; overflow-y: auto; flex: 1; }
    .lib-title { font-size: 11px; color: var(--muted); text-transform: uppercase; margin: 10px 6px 6px; letter-spacing: 1px; }
    .lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .item {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 6px; text-align: center;
      cursor: pointer; transition: .15s; font-size: 12px;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-2px); background: #232c38; }
    .item .ico { font-size: 22px; display: block; margin-bottom: 4px; }

    /* ---- 中间：画布 ---- */
    #stage { flex: 1; position: relative; }
    #canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 20px;
      font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap;
    }
    #toolbar {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(23,28,36,.9);
      padding: 6px; border-radius: 12px; border: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .tbtn {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: .12s;
    }
    .tbtn:hover { border-color: var(--accent); }
    .tbtn.active { background: var(--accent-2); border-color: var(--accent); color: #fff; }
    .tbtn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ---- 右侧：属性 ---- */
    #inspector {
      width: 260px; flex-shrink: 0; background: var(--panel);
      border-left: 1px solid var(--border); display: flex; flex-direction: column;
    }
    .insp-head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .insp-body { padding: 14px; overflow-y: auto; flex: 1; }
    .empty-state { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; line-height: 1.6; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
    .row { display: flex; gap: 6px; }
    .row input { flex: 1; min-width: 0; }
    input[type="number"], input[type="text"] {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 7px; padding: 7px 8px; font-size: 13px;
    }
    input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="color"] { width: 100%; height: 36px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; padding: 3px; }
    input[type="range"] { width: 100%; }
    .axis { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
    .btn {
      width: 100%; padding: 9px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: .12s;
    }
    .btn.del { background: var(--danger); color: #fff; }
    .btn.del:hover { filter: brightness(1.1); }
    .btn.dup { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); margin-bottom: 8px; }
    .btn.dup:hover { border-color: var(--accent); }

    /* ---- 底栏 ---- */
    #footer {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 10px; justify-content: center;
    }
    #stats { position: absolute; top: 12px; left: 12px; font-size: 11px; color: var(--muted); background: rgba(0,0,0,.4); padding: 4px 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 组件库 -->
    <aside id="sidebar">
      <div class="side-head"><span class="logo">⬢</span> 工厂编辑器</div>
      <div class="lib" id="lib"></div>
      <div style="padding:10px;border-top:1px solid var(--border);">
        <button class="btn dup" id="btnImportGlb" style="width:100%;">⬆ 导入 .glb 模型</button>
        <input type="file" id="glbInput" accept=".glb,.gltf" style="display:none" />
      </div>
    </aside>

    <!-- 3D 画布 -->
    <section id="stage">
      <canvas id="canvas"></canvas>
      <div id="stats"></div>
      <div id="toolbar">
        <button class="tbtn active" data-mode="translate" title="移动 (W)">✛ 移动</button>
        <button class="tbtn" data-mode="rotate" title="旋转 (E)">⟳ 旋转</button>
        <button class="tbtn" data-mode="scale" title="缩放 (R)">⤢ 缩放</button>
        <span style="width:1px;background:var(--border);margin:0 2px;"></span>
        <button class="tbtn" id="btnGrid" title="网格吸附">⊞ 吸附</button>
        <button class="tbtn" id="btnAnim" title="播放/暂停动画 (空格)">▶ 动画</button>
        <button class="tbtn" id="btnView" title="切换俯视/透视 (V)">⬒ 俯视</button>
        <span style="width:1px;background:var(--border);margin:0 2px;"></span>
        <button class="tbtn" id="btnGroup" title="成组选中 (G)">⛓ 成组</button>
        <button class="tbtn" id="btnUngroup" title="解组 (Shift+G)">⛓̸ 解组</button>
        <button class="tbtn danger" id="btnClear" title="清空场景">🗑 清空</button>
      </div>
      <div id="hint">拖拽旋转视角 · 滚轮缩放 · 点击选中 · Shift+点击多选 · 从左侧添加组件</div>
      <div id="footer">
        <button class="tbtn" id="btnSave">💾 保存</button>
        <button class="tbtn" id="btnLoad">📂 加载</button>
        <button class="tbtn" id="btnExport">⬇ 导出</button>
        <button class="tbtn" id="btnImport">⬆ 导入</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none" />
      </div>
    </section>

    <!-- 属性面板 -->
    <aside id="inspector">
      <div class="insp-head">属性</div>
      <div class="insp-body" id="inspBody">
        <div class="empty-state">未选中物体<br/><br/>点击场景中的物体<br/>进行编辑</div>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./factory.js"></script>
</body>
</html>
